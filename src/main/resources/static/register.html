<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CarRentalServices - Register</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .hero {
            background-image:
                    linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
                    url('https://upload.wikimedia.org/wikipedia/commons/4/40/WV_banner_Car_rental.jpg');
            background-size: cover;
            background-position: center;
            min-height: 260px;
            display: flex;
            align-items: center;
        }
        .card-shadow { box-shadow: 0 10px 30px rgba(0,0,0,.08); border: 0; }
        .thumb {
            width: 100%;
            max-height: 210px;
            object-fit: cover;
            border-radius: .5rem;
        }
    </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="/dashboard.html">CarRentalServices</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/login.html">Login</a>
                <a class="nav-link active" href="/register.html">Register</a>
            </div>
        </div>
    </div>
</nav>

<header class="hero text-white">
    <div class="container">
        <h1 class="display-6 fw-bold mb-2">Create your account</h1>
        <p class="mb-0">Register to start booking cars.</p>
    </div>
</header>

<main class="container my-5">
    <div class="row g-4 justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card card-shadow rounded-3 p-4 p-md-5">
                <h2 class="h4 fw-bold mb-2">Register</h2>
                <p class="text-muted mb-4">Fill in your details below.</p>

                <div id="msg" class="alert d-none" role="alert"></div>

                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input class="form-control" name="username" placeholder="Choose a username" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input class="form-control" type="email" name="email" placeholder="you@email.com" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input class="form-control" type="password" name="password" placeholder="Create a password" required>
                    </div>

                    <button class="btn btn-success w-100 py-2" type="submit">Create Account</button>

                    <div class="mt-3 small text-muted">
                        Already have an account? <a href="/login.html">Login here</a>.
                    </div>
                </form>

                <hr class="my-4">


                    <div class="col-12 col-md-6">
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<script>

    const API_BASE = "/api/users";

    const form = document.getElementById("registerForm");
    const msg = document.getElementById("msg");

    function showMsg(type, text) {
        msg.className = "alert alert-" + type;
        msg.textContent = text;
        msg.classList.remove("d-none");
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const data = {
            username: form.username.value.trim(),
            email: form.email.value.trim(),
            password: form.password.value
        };

        try {
            const res = await fetch(API_BASE + "/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                showMsg("success", "Account created! Redirecting to login...");
                setTimeout(() => window.location.href = "/login.html", 900);
            } else {
                showMsg("danger", "Register failed. Username/email may already exist.");
            }
        } catch (err) {
            showMsg("warning", "Could not connect to the server. Is Spring running?");
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
