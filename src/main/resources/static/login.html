<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CarRentalServices - Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .hero {
            background-image:
                    linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
                    url('https://upload.wikimedia.org/wikipedia/commons/4/40/WV_banner_Car_rental.jpg');
            background-size: cover;
            background-position: center;
            min-height: 260px;
            display: flex;
            align-items: center;
        }
        .card-shadow { box-shadow: 0 10px 30px rgba(0,0,0,.08); border: 0; }
        .side-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-top-right-radius: .5rem;
            border-bottom-right-radius: .5rem;
            min-height: 320px;
        }
    </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="/dashboard.html">CarRentalServices</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="/login.html">Login</a>
                <a class="nav-link" href="/register.html">Register</a>
            </div>
        </div>
    </div>
</nav>

<header class="hero text-white">
    <div class="container">
        <h1 class="display-6 fw-bold mb-2">Welcome back</h1>
        <p class="mb-0">Log in to book and manage your rentals.</p>
    </div>
</header>

<main class="container my-5">
    <div class="row g-4 justify-content-center">
        <div class="col-12 col-lg-10">
            <div class="card card-shadow rounded-3 overflow-hidden">
                <div class="row g-0">
                    <div class="col-12 col-md-7 p-4 p-md-5">
                        <h2 class="h4 fw-bold mb-2">Login</h2>
                        <p class="text-muted mb-4">Use your username and password.</p>

                        <div id="msg" class="alert d-none" role="alert"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input class="form-control" name="username" placeholder="e.g. alice01" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input class="form-control" type="password" name="password" placeholder="Your password" required>
                            </div>

                            <button class="btn btn-primary w-100 py-2" type="submit">Login</button>

                            <div class="mt-3 small text-muted">
                                No account? <a href="/register.html">Create one here</a>.
                            </div>
                        </form>
                    </div>

                    <div class="col-12 col-md-5 d-none d-md-block">
                        <img class="side-img" alt="Car rental parking"
                             src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Car_rental-park.jpg">
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    /////
    const API_BASE = "/api/users";

    const form = document.getElementById("loginForm");
    const msg = document.getElementById("msg");

    function showMsg(type, text) {
        msg.className = "alert alert-" + type;
        msg.textContent = text;
        msg.classList.remove("d-none");
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const data = {
            username: form.username.value.trim(),
            password: form.password.value
        };

        try {
            const res = await fetch(API_BASE + "/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                window.location.href = "/dashboard.html";
            } else {
                showMsg("danger", "Login failed. Check your username/password.");
            }
        } catch (err) {
            showMsg("warning", "Could not connect to the server. Is Spring running?");
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
