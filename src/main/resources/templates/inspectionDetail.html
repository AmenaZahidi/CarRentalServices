<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inspection Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card">
        <div class="card-header">
            <h4>Inspection Details #<span th:text="${inspection.inspectionId}"></span></h4>
        </div>
        <div class="card-body">
            <p><strong>Booking ID:</strong> <span th:text="${inspection.bookingId}"></span></p>
            <p><strong>Inspected By User ID:</strong> <span th:text="${inspection.inspectedByUserId}"></span></p>
            <hr>
            <p><strong>Return Date:</strong> <span th:text="${inspection.actualReturnDate}"></span></p>
            <p><strong>Mileage In:</strong> <span th:text="${inspection.mileageIn}"></span></p>
            <p><strong>Fuel Level:</strong> <span th:text="${inspection.fuelLevel}"></span></p>
            <hr>
            <p><strong>Notes:</strong></p>
            <div class="p-3 border rounded bg-white" th:text="${inspection.damageNotes}"></div>
        </div>
        <div class="card-footer">
            <a th:href="@{/admin/history}" class="btn btn-secondary">Back to History</a>
        </div>
    </div>
</div>
</body>
</html>
