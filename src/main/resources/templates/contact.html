<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect With Us - CarRentalServices</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            /* Wallpaper: Road between trees */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
            url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: rgba(33, 37, 41, 0.95) !important;
        }

        .content-wrapper {
            flex: 1 0 auto;
        }

        .team-card {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 15px;
            transition: 0.3s;
        }

        .avatar-circle {
            width: 70px; height: 70px;
            background: #0d6efd;
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: bold;
            border-radius: 50%; margin: 0 auto 15px;
        }

        .footer-board {
            background-color: rgba(33, 37, 41, 0.95);
            color: white;
            padding: 20px 0;
            margin-top: 50px;
        }
    </style>
</head>
<body>

<div class="content-wrapper">
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/dashboard}">CarRentalServices</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/dashboard}">Home</a>
                <a class="nav-link active" th:href="@{/contact}">Contact Us</a>
            </div>
        </div>
    </nav>

    <main class="container my-5 text-center">
        <h1 class="display-4 fw-bold text-white mb-5">Connect With Us</h1>

        <div class="row g-4 justify-content-center">
            <div class="col-md-4">
                <div class="card shadow team-card p-4">
                    <div class="avatar-circle">AZ</div>
                    <h4 class="fw-bold">Amena Zahidi</h4>
                    <p class="text-primary fw-bold">Senior Admin</p>
                    <p>+353 1 800 111</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow team-card p-4">
                    <div class="avatar-circle">B</div>
                    <h4 class="fw-bold">Bema</h4>
                    <p class="text-primary fw-bold">Fleet Operations</p>
                    <p>+353 1 800 222</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow team-card p-4">
                    <div class="avatar-circle">J</div>
                    <h4 class="fw-bold">Julie</h4>
                    <p class="text-primary fw-bold">Customer Success</p>
                    <p>+353 1 800 333</p>
                </div>
            </div>
        </div>

        <div class="mt-5">
            <a th:href="@{/dashboard}" class="btn btn-light px-5 shadow">Back to Dashboard</a>
        </div>
    </main>
</div>

<footer class="footer-board text-center">
    <div class="container">
        <p>© 2026 CarRentalServices | <a href="#" class="text-white text-decoration-none">📸 Instagram</a></p>
    </div>
</footer>

</body>
</html>
