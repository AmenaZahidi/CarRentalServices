<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Return Inspection - CarRentalServices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
            url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .content-wrapper { flex: 1 0 auto; }
        .navbar { background-color: rgba(33, 37, 41, 0.9) !important; }
        .page-panel {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .footer-board {
            background-color: rgba(33, 37, 41, 0.95);
            color: white;
            padding: 20px 0;
            flex-shrink: 0;
        }
        .social-link {
            color: #E1306C;
            text-decoration: none;
            font-weight: bold;
        }
        .social-link:hover { color: #ff5e9a; text-decoration: underline; }
    </style>
</head>
<body class="vanta-page">
<div class="content-wrapper">
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/dashboard}">CarRentalServices</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" th:href="@{/dashboard}">Home</a>
                    <a class="nav-link" th:href="@{/carDetails}">Browse Cars</a>
                    <a class="nav-link" th:href="@{/bookings}">Manage Bookings</a>
                    <a class="nav-link" th:href="@{/locations}">Locations</a>
                    <a class="nav-link" th:href="@{/contact}">Contact Us</a>
                    <div class="ms-lg-3">
                        <a class="btn btn-outline-danger btn-sm" th:href="@{/logout}">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="page-panel p-4">
                    <h1 class="h3 mb-4">Return Inspection</h1>

                    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/admin/return-check}" method="post">
                        <input type="hidden" name="bookingId" th:value="${bookingId}">
                        <input type="hidden" name="carId" th:value="${carId}">

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Actual Return Date</label>
                                <input type="date" name="actualReturnDate" class="form-control" th:value="${today}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Mileage In</label>
                                <input type="number" name="mileageIn" class="form-control" placeholder="Current odometer" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Fuel Level</label>
                                <select name="fuelLevel" class="form-select">
                                    <option value="Full">Full</option>
                                    <option value="75%">75%</option>
                                    <option value="50%">50%</option>
                                    <option value="Empty">Empty</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="returnedOnTime" id="onTime" checked>
                            <label class="form-check-label" for="onTime">Returned on time?</label>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="damageFound" id="damage">
                            <label class="form-check-label text-danger" for="damage">Damage found?</label>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Damage/Return Notes</label>
                            <textarea name="damageNotes" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="d-flex justify-content-between gap-2">
                            <a th:href="@{/carDetails}" class="btn btn-outline-secondary">Back to Fleet</a>
                            <button type="submit" class="btn btn-success">Complete Inspection</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<footer class="footer-board text-center">
    <div class="container">
        <p class="mb-2">&copy; 2026 CarRentalServices. All rights reserved.</p>
        <div class="d-flex justify-content-center align-items-center gap-3">
            <span>Follow our journey:</span>
            <a href="https://www.instagram.com/yourhandle" target="_blank" class="social-link">Instagram</a>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
