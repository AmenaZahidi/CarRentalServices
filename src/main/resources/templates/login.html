<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CarRentalServices - Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .content-wrapper { flex: 1 0 auto; }
        .hero {
            background-image:
                    linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
                    url('https://upload.wikimedia.org/wikipedia/commons/4/40/WV_banner_Car_rental.jpg');
            background-size: cover;
            background-position: center;
            min-height: 260px;
            display: flex;
            align-items: center;
        }
        .card-shadow { box-shadow: 0 10px 30px rgba(0,0,0,.08); border: 0; }
        .footer-board {
            background-color: rgba(33, 37, 41, 0.95);
            color: white;
            padding: 20px 0;
            flex-shrink: 0;
        }
        .social-link {
            color: #E1306C;
            text-decoration: none;
            font-weight: bold;
        }
        .social-link:hover { color: #ff5e9a; text-decoration: underline; }
        .side-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-top-right-radius: .5rem;
            border-bottom-right-radius: .5rem;
            min-height: 320px;
        }
    </style>
</head>

<body class="bg-light">
<div class="content-wrapper">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="/dashboard" th:href="@{/dashboard}">CarRentalServices</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="login" th:href="@{/login}">Login</a>
                <a class="nav-link" href="register" th:href="@{/register}">Register</a>
            </div>
        </div>
    </div>
</nav>

<header class="hero text-white">
    <div class="container">
        <h1 class="display-6 fw-bold mb-2">Welcome back</h1>
        <p class="mb-0">Log in to book and manage your rentals.</p>
    </div>
</header>

<main class="container my-5">
    <div class="row g-4 justify-content-center">
        <div class="col-12 col-lg-10">
            <div class="card card-shadow rounded-3 overflow-hidden">
                <div class="row g-0">
                    <div class="col-12 col-md-7 p-4 p-md-5">
                        <h2 class="h4 fw-bold mb-2">Login</h2>
                        <p class="text-muted mb-4">Use your username and password.</p>

                        <!-- Thymeleaf messages -->
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

                        <form method="post" action="login" th:action="@{/login}">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input class="form-control" name="username" placeholder="e.g. alice01" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input class="form-control" type="password" name="password" placeholder="Your password" required>
                            </div>

                            <button class="btn btn-primary w-100 py-2" type="submit">Login</button>

                            <div class="mt-3 small text-muted">
                                No account? <a href="register" th:href="@{/register}">Create one here</a>.
                            </div>
                        </form>
                    </div>

                    <div class="col-12 col-md-5 d-none d-md-block">
                        <img class="side-img" alt="Car rental parking"
                             src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Car_rental-park.jpg">
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</div>

<footer class="footer-board text-center">
    <div class="container">
        <p class="mb-2">&copy; 2026 CarRentalServices. All rights reserved.</p>
        <div class="d-flex justify-content-center align-items-center gap-3">
            <span>Follow our journey:</span>
            <a href="https://www.instagram.com/yourhandle" target="_blank" class="social-link">Instagram</a>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
