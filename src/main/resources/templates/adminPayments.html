<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Payments - CarRentalServices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f8; min-height: 100vh; display: flex; flex-direction: column; }
        .content-wrapper { flex: 1 0 auto; }
        .navbar { background-color: rgba(33, 37, 41, 0.95) !important; }
        .page-panel { background: white; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        .footer-board { background-color: rgba(33, 37, 41, 0.95); color: white; padding: 20px 0; flex-shrink: 0; }
    </style>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body class="vanta-page">
<div class="content-wrapper">
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">Admin Panel</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" th:href="@{/admin/dashboard}">Admin Home</a>
                    <a class="nav-link" th:href="@{/admin/bookings}">Bookings</a>
                    <a class="nav-link active" th:href="@{/admin/payments}">Payments</a>
                    <a class="nav-link" th:href="@{/admin/licences}">Licences</a>
                    <a class="nav-link" th:href="@{/admin/history}">Returns</a>
                    <a class="nav-link" th:href="@{/dashboard}">User Dashboard</a>
                    <div class="ms-lg-3">
                        <a class="btn btn-outline-danger btn-sm" th:href="@{/logout}">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="page-panel p-4">
            <h1 class="h3 mb-4">Payments</h1>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Payment ID</th>
                        <th>Booking ID</th>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Reference</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="payment : ${payments}">
                        <td th:text="${payment.paymentId}">1</td>
                        <td th:text="${payment.bookingId}">1</td>
                        <td th:text="${#dates.format(payment.paymentDate, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
                        <td th:text="${'EUR ' + #numbers.formatDecimal(payment.amount, 1, 2)}">EUR 0.00</td>
                        <td><span class="badge text-bg-success" th:text="${payment.paymentStatus}">paid</span></td>
                        <td th:text="${payment.transactionRef}">SIM-REF</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(payments)}">
                        <td colspan="6" class="text-center py-4 text-muted">No payments found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<footer class="footer-board text-center"><div class="container"><p class="mb-0">&copy; 2026 CarRentalServices. All rights reserved.</p></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
