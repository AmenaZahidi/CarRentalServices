<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard - CarRentalServices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
            url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .content-wrapper { flex: 1 0 auto; }
        .navbar { background-color: rgba(33, 37, 41, 0.9) !important; }
        .page-panel {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .footer-board {
            background-color: rgba(33, 37, 41, 0.95);
            color: white;
            padding: 20px 0;
            flex-shrink: 0;
        }
        .admin-card {
            text-decoration: none;
            color: #212529;
        }
        .admin-card .card {
            border: 0;
            border-radius: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .admin-card:hover .card {
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.18);
        }
    </style>
</head>
<body class="vanta-page">
<div class="content-wrapper">
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">Admin Panel</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link active" th:href="@{/admin/dashboard}">Admin Home</a>
                    <a class="nav-link" th:href="@{/admin/bookings}">Bookings</a>
                    <a class="nav-link" th:href="@{/admin/payments}">Payments</a>
                    <a class="nav-link" th:href="@{/admin/licences}">Licences</a>
                    <a class="nav-link" th:href="@{/admin/history}">Returns</a>
                    <a class="nav-link" th:href="@{/dashboard}">User Dashboard</a>
                    <div class="ms-lg-3">
                        <a class="btn btn-outline-danger btn-sm" th:href="@{/logout}">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="page-panel p-4">
            <h1 class="h3 mb-1">Admin Dashboard</h1>
            <p class="text-muted mb-4">Logged in as <strong th:text="${username}">admin</strong></p>

            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <div class="row g-4">
                <a class="col-md-3 admin-card" th:href="@{/admin/bookings}">
                    <div class="card h-100 p-4">
                        <div class="text-muted small">Total</div>
                        <div class="display-6 fw-bold" th:text="${bookingCount ?: 0}">0</div>
                        <div class="fw-semibold">Bookings</div>
                    </div>
                </a>
                <a class="col-md-3 admin-card" th:href="@{/admin/payments}">
                    <div class="card h-100 p-4">
                        <div class="text-muted small">Recorded</div>
                        <div class="display-6 fw-bold" th:text="${paymentCount ?: 0}">0</div>
                        <div class="fw-semibold">Payments</div>
                    </div>
                </a>
                <a class="col-md-3 admin-card" th:href="@{/admin/licences}">
                    <div class="card h-100 p-4">
                        <div class="text-muted small">Uploaded</div>
                        <div class="display-6 fw-bold" th:text="${licenceCount ?: 0}">0</div>
                        <div class="fw-semibold">Licence Proofs</div>
                    </div>
                </a>
                <a class="col-md-3 admin-card" th:href="@{/admin/history}">
                    <div class="card h-100 p-4">
                        <div class="text-muted small">Completed</div>
                        <div class="display-6 fw-bold" th:text="${inspectionCount ?: 0}">0</div>
                        <div class="fw-semibold">Return Inspections</div>
                    </div>
                </a>
            </div>
        </div>
    </main>
</div>

<footer class="footer-board text-center">
    <div class="container">
        <p class="mb-0">&copy; 2026 CarRentalServices. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
