<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Booking | Dundalk Drive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
            url('https://images.unsplash.com/photo-1549918830-11ec394593f3?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            color:white;
            min-height:100vh;
        }
        .navbar-custom { background:#1c1c1e; border-bottom:1px solid #3a3a3c; }
        .nav-link { color:#f2f2f7 !important; }
        .nav-link:hover { color:#00e676 !important; }
        .booking-card { background:white; color:#1c1c1e; border-radius:12px; padding:35px; box-shadow:0 10px 30px rgba(0,0,0,0.4); }
        .car-preview { background:#f7f7f7; padding:20px; border-radius:10px; text-align:center; }
        .car-preview img { height:120px; object-fit:contain; }
        .btn-book { background:#ff5a1f; border:none; font-weight:bold; }
        .btn-book:hover { background:#e04910; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
        <a class="navbar-brand" th:href="@{/carDetails}">DUNDALK DRIVE</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/carDetails}">Browse Vehicles</a>
            <a class="nav-link" th:href="@{/booking/myBookings}">My Bookings</a>
            <a class="nav-link text-primary" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="booking-card">
                <h2 class="fw-bold mb-4">Create Booking</h2>


                <div class="car-preview mb-4">
                    <img th:src="${car.imageUrl != null} ? ${car.imageUrl} : 'https://www.pngall.com/wp-content/uploads/2016/07/Car-PNG-File.png'" alt="Car">
                    <h5 class="mt-3 fw-bold" th:text="${car.make + ' ' + car.model}">BMW 3 Series</h5>
                    <p class="text-muted" th:text="${car.carYear + ' • ' + car.transmission}">2022 • Manual</p>
                </div>

                <!-- Booking Form -->
                <form th:action="@{/bookings}" th:object="${booking}" method="post">


                    <input type="hidden" th:field= "${carId}" th:value="${car.carId}">
                    <input type="hidden" th:field="${userId}" th:value="${loggedUserId}">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Pickup Date & Time</label>
                            <input type="datetime-local" class="form-control" th:field="${pickupDateTime}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Return Date & Time</label>
                            <input type="datetime-local" class="form-control" th:field="${returnDateTime}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Pickup Location</label>
                            <select class="form-select" th:field="${pickupLocationId}">
                                <option th:each="location : ${locations}"
                                        th:value="${location.locationId}"
                                        th:text="${location.branchName}">Dundalk Branch</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Driver</label>
                            <select class="form-select" th:field="${driverId}">
                                <option th:each="driver : ${drivers}"
                                        th:value="${driver.driverId}"
                                        th:text="${driver.firstName + ' ' + driver.lastName}">John Doe</option>
                            </select>
                        </div>

                    </div>

                    <hr class="my-4">
                    <button class="btn btn-book w-100 py-2">Confirm Booking</button>
                </form>

            </div>
        </div>
    </div>
</div>
<footer class="footer-board text-center">
    <div class="container">
        <p class="mb-2">© 2026 CarRentalServices. All rights reserved.</p>
        <div class="d-flex justify-content-center align-items-center gap-3">
            <span>Follow our journey:</span>
            <a href="https://www.instagram.com/yourhandle" target="_blank" class="social-link">
                📸 Instagram
            </a>
        </div>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
