<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browse Vehicles | Dundalk Drive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            /* ✅ Fixed Background: Synced with your high-end dashboard style */
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
            url('https://images.unsplash.com/photo-1549918830-11ec394593f3?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            font-family: sans-serif;
        }

        /* ✅ Navbar synced with image_826e54.png */
        .navbar-custom {
            background-color: #1c1c1e;
            border-bottom: 1px solid #3a3a3c;
            padding: 0.8rem 0;
        }
        .navbar-brand .logo-drive { color: #00e676; font-weight: 800; }
        .nav-link { color: #f2f2f7 !important; transition: 0.2s; }
        .nav-link:hover { color: #00e676 !important; }

        .dashboard-box {
            background-color: rgba(58, 58, 60, 0.9);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #48484a;
            backdrop-filter: blur(10px);
        }

        /* ✅ White Grid: Matches Dundalk/Skyscanner style in image_90f55f.jpg */
        .car-table-box {
            background-color: white;
            border-radius: 12px;
            padding: 40px;
            color: #1c1c1e;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .car-card {
            border: 1px solid #eee;
            border-radius: 10px;
            transition: 0.3s;
            height: 100%;
        }
        .car-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        .car-img-box { background: #fdfdfd; padding: 15px; text-align: center; }
        .car-img-box img { max-width: 100%; height: 100px; object-fit: contain; }

        .btn-view-deal {
            background: #ff5a1f;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            width: 100%;
        }
        .btn-view-deal:hover { background: #e04910; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/carDetails}"> DUNDALK DRIVE</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/carDetails}">Browse Vehicles</a>
            <a class="nav-link" th:href="@{/carDetails/contact}">Contact Us</a>
            <a class="nav-link text-primary" th:href="@{/login}">Login</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="dashboard-box mb-4">
        <h4 class="border-bottom pb-2 mb-3">Sort Fleet</h4>
        <div class="d-flex gap-4">
            <a th:href="@{/carDetails(sort='mileageDesc')}" class="text-white text-decoration-none">🚗 High Mileage</a>
            <a th:href="@{/carDetails(sort='mileageAsc')}" class="text-white text-decoration-none">📉 Low Mileage</a>
        </div>
    </div>

    <div class="car-table-box">
        <h2 class="fw-bold mb-4">Cheap car hire in Dundalk</h2>

        <div class="row g-4">
            <div class="col-md-4 col-lg-3" th:each="car : ${cars}">
                <div class="car-card">
                    <div class="car-img-box">
                        <img src="https://www.pngall.com/wp-content/uploads/2016/07/Car-PNG-File.png" alt="Car">
                    </div>
                    <div class="p-3">
                        <div class="d-flex justify-content-between align-items-start">
                            <h6 class="fw-bold mb-0" th:text="${car.make + ' ' + car.model}">BMW 3 SERIES</h6>
                            <span class="badge bg-light text-dark border" th:text="${car.carYear}">2022</span>
                        </div>
                        <p class="small text-muted mb-2" th:text="${car.transmission}">Manual</p>

                        <div class="mt-2 mb-3">
                            <span class="fs-4 fw-bold text-success" th:text="${car.mileage + ' km'}">0 km</span>
                        </div>

                        <a th:href="@{/booking/create(carId=${car.carId})}" class="btn btn-view-deal py-2">View Deal</a>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(cars)}" class="col-12 text-center py-5">
                <h3 class="text-muted">No cars available at this location.</h3>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
