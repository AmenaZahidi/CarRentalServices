<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inspection History - CarRentalServices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
            url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .content-wrapper { flex: 1 0 auto; }
        .navbar { background-color: rgba(33, 37, 41, 0.9) !important; }
        .page-panel {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .footer-board {
            background-color: rgba(33, 37, 41, 0.95);
            color: white;
            padding: 20px 0;
            flex-shrink: 0;
        }
        .social-link {
            color: #E1306C;
            text-decoration: none;
            font-weight: bold;
        }
        .social-link:hover { color: #ff5e9a; text-decoration: underline; }
    </style>
</head>
<body class="vanta-page">
<div class="content-wrapper">
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/dashboard}">CarRentalServices</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" th:href="@{/dashboard}">Home</a>
                    <a class="nav-link" th:href="@{/carDetails}">Browse Cars</a>
                    <a class="nav-link" th:href="@{/bookings}">Manage Bookings</a>
                    <a class="nav-link" th:href="@{/locations}">Locations</a>
                    <a class="nav-link" th:href="@{/contact}">Contact Us</a>
                    <div class="ms-lg-3">
                        <a class="btn btn-outline-danger btn-sm" th:href="@{/logout}">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="page-panel p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h3 mb-0">Inspection History</h1>
                <a th:href="@{/carDetails}" class="btn btn-outline-secondary">Back to Fleet</a>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Booking ID</th>
                        <th>Date</th>
                        <th>Damage</th>
                        <th>Mileage</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="insp : ${inspections}">
                        <td th:text="${insp.inspectionId}">1</td>
                        <td th:text="${insp.bookingId}">1</td>
                        <td th:text="${insp.actualReturnDate}">2026-01-01</td>
                        <td>
                            <span th:if="${insp.damageFound}" class="badge bg-danger">YES</span>
                            <span th:unless="${insp.damageFound}" class="badge bg-success">NO</span>
                        </td>
                        <td th:text="${insp.mileageIn}">10000</td>
                        <td class="text-end">
                            <a th:href="@{'/admin/view/' + ${insp.inspectionId}}" class="btn btn-sm btn-info">View</a>
                            <form th:action="@{'/admin/delete/' + ${insp.inspectionId}}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete this record?')">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(inspections)}">
                        <td colspan="6" class="text-center py-4 text-muted">No inspections found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<footer class="footer-board text-center">
    <div class="container">
        <p class="mb-2">&copy; 2026 CarRentalServices. All rights reserved.</p>
        <div class="d-flex justify-content-center align-items-center gap-3">
            <span>Follow our journey:</span>
            <a href="https://www.instagram.com/yourhandle" target="_blank" class="social-link">Instagram</a>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
