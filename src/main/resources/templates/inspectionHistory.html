<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inspection History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Inspection History</h2>
    <table class="table table-striped table-hover mt-3">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Booking ID</th>
            <th>Date</th>
            <th>Damage</th>
            <th>Mileage</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="insp : ${inspections}">
            <td th:text="${insp.inspectionId}"></td>
            <td th:text="${insp.bookingId}"></td>
            <td th:text="${insp.actualReturnDate}"></td>
            <td>
                <span th:if="${insp.damageFound}" class="badge bg-danger">YES</span>
                <span th:unless="${insp.damageFound}" class="badge bg-success">NO</span>
            </td>
            <td th:text="${insp.mileageIn}"></td>
            <td>
                <a th:href="@{'/admin/view/' + ${insp.inspectionId}}" class="btn btn-sm btn-info">View</a>
                <form th:action="@{'/admin/delete/' + ${insp.inspectionId}}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete this record?')">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/carDetails}" class="btn btn-primary">Back to Fleet</a>
</div>
</body>
</html>
